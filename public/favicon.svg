<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1f26"/>
      <stop offset="100%" stop-color="#0c0d10"/>
    </linearGradient>
    <linearGradient id="titanium" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c8cdd5"/>
    </linearGradient>
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#ff5722" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Chassis Base (Machined Audiophile Squircle) -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#2b2e38" stroke-width="1.5"/>
  <rect x="3.5" y="3.5" width="57" height="57" rx="12.5" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- Acoustic Microgroove Orbit Rings -->
  <circle cx="32" cy="32" r="23" stroke="rgba(255,255,255,0.06)" stroke-width="1" fill="none"/>
  <circle cx="32" cy="32" r="18" stroke="rgba(255,87,34,0.15)" stroke-width="0.8" fill="none" stroke-dasharray="2 2.5"/>

  <!-- Precision Aether Geometric Glyph (A) -->
  <path d="M 32 11 L 49 48 H 40.5 L 36.8 39 H 27.2 L 23.5 48 H 15 Z" fill="url(#titanium)"/>
  
  <!-- Counter Aperture -->
  <path d="M 32 23.5 L 36.2 33.5 H 27.8 Z" fill="#0e1014"/>

  <!-- Precision Machined Braun Orange Cross-Bar -->
  <rect x="25.5" y="37" width="13" height="3" rx="1.5" fill="#ff5722"/>

  <!-- Braun Focal Amber Dot with Core Highlight -->
  <circle cx="32" cy="27" r="3.2" fill="#ff5722" filter="url(#amberGlow)"/>
  <circle cx="32" cy="27" r="1.2" fill="#ffffff"/>

  <!-- Sub-Acoustic Tuning Indicator -->
  <circle cx="32" cy="54" r="1.5" fill="#ff5722" opacity="0.8"/>
  <line x1="26" y1="54" x2="29" y2="54" stroke="rgba(255,255,255,0.2)" stroke-width="1" stroke-linecap="round"/>
  <line x1="35" y1="54" x2="38" y2="54" stroke="rgba(255,255,255,0.2)" stroke-width="1" stroke-linecap="round"/>
</svg>